name: Build Card Factory Profit & Loss

on:
  push:
    branches: [ "main" ]
    # Numbered releases: pushing a tag vX.Y.Z also publishes that build as a full
    # release, which is what the app's updater offers.
    tags: [ "v*" ]
  workflow_dispatch: {}

permissions:
  contents: write

# Pushing several commits close together starts a run for each; only the newest
# matters, so newer runs supersede older ones rather than racing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore CardFactory.ProfitLoss.sln

      - name: Run tests
        run: dotnet test CardFactory.ProfitLoss.sln --configuration Release --no-restore

      - name: Publish app
        shell: pwsh
        run: |
          # Stage 6B.13: output is captured so a failure can be reported somewhere
          # readable. The run log lives on a storage host, and the check-run
          # annotations API needs a Checks permission the working token does not have,
          # so a red build previously said only "Publish app failed" with no compiler
          # error anywhere reachable. Two stages were spent guessing at one.
          dotnet publish src/CardFactory.ProfitLoss.App/CardFactory.ProfitLoss.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            --output publish 2>&1 | Tee-Object -FilePath build-output.txt
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }

      - name: Report build errors
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The compiler errors go into a prerelease. An issue was tried first, but reading
          # issues needs an Issues permission the working token does not have, whereas
          # releases are readable with contents alone.
          #
          # Stage 6B.16: one rolling tag rather than one per run. A tag per run meant
          # build-error-85 and build-error-86 were still sitting above latest-test on the
          # releases page days after the build was fixed, so the first thing anyone saw
          # was a stale failure notice. Only the most recent failure is of any use - the
          # older ones describe code that no longer exists.
          if (-not (Test-Path build-output.txt)) { exit 0 }
          $errors = Select-String -Path build-output.txt -Pattern "error [A-Z]+[0-9]+|: error" |
                    Select-Object -ExpandProperty Line -Unique |
                    Select-Object -First 40
          if (-not $errors) { $errors = Get-Content build-output.txt | Select-Object -Last 40 }
          $body = "Run $env:GITHUB_RUN_NUMBER on commit $env:GITHUB_SHA.`n`n" +
                  '```' + "`n" + ($errors -join "`n") + "`n" + '```'
          gh release delete build-error --yes --cleanup-tag 2>$null
          gh release create build-error `
            --title "Build failure - run $env:GITHUB_RUN_NUMBER" `
            --notes $body `
            --prerelease

      - name: Package build
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath CardFactory-ProfitLoss-win-x64.zip -Force

      # Releases hold numbered versions only. Test builds from pushes to main are a
      # workflow artifact instead (Actions tab -> the run -> Artifacts), kept 14 days,
      # so the public Releases page shows just the versions people should install.
      # (Artifacts failed while this repo was private: the account's storage quota.
      # Public repositories are not subject to it.)
      - name: Keep the test build
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: CardFactory-ProfitLoss-win-x64-test-build
          path: CardFactory-ProfitLoss-win-x64.zip
          retention-days: 14
          if-no-files-found: error

      # The updater only offers full releases. The tag must match <Version> in
      # Directory.Build.props, so the version the app reports and the release it came
      # from can never disagree, and the release carries a .sha256 that the updater checks
      # every download against. Release notes are the annotated tag's message.
      - name: Publish version release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          [xml]$props = Get-Content Directory.Build.props
          $version = @($props.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ })[0]
          if ("v$version" -ne $tag) { Write-Error "Tag $tag does not match Version $version in Directory.Build.props"; exit 1 }

          $hash = (Get-FileHash CardFactory-ProfitLoss-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("CardFactory-ProfitLoss-win-x64.zip.sha256", "$hash  CardFactory-ProfitLoss-win-x64.zip")

          $notes = ""
          $ref = gh api "repos/${{ github.repository }}/git/ref/tags/$tag" | ConvertFrom-Json
          if ($ref.object.type -eq "tag") {
            $notes = (gh api "repos/${{ github.repository }}/git/tags/$($ref.object.sha)" | ConvertFrom-Json).message
          }
          if (-not $notes) { $notes = "Improvements and fixes." }
          [IO.File]::WriteAllText("release-notes.md", $notes)

          gh release create $tag CardFactory-ProfitLoss-win-x64.zip CardFactory-ProfitLoss-win-x64.zip.sha256 `
            --title "Card Factory Profit & Loss $version" --notes-file release-notes.md --latest
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Clear the build failure notice
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Stage 6B.16: a green build removes the failure notice. Without this the notice
          # outlives the fault and reads as if the build is still broken. Deletion is best
          # effort - failing to remove a notice must never fail a build that compiled.
          gh release delete build-error --yes --cleanup-tag 2>$null
          exit 0
